<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="refresh" content="0; url=https://vinyl.yukostudio.cn/">
  <link rel="canonical" href="https://vinyl.yukostudio.cn/">
  <title>Redirecting to Vinyl</title>
  <script>
    (() => {
      const target = new URL("https://vinyl.yukostudio.cn/");
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <noscript><a href="https://vinyl.yukostudio.cn/">Open Vinyl</a></noscript>
</body>
</html>
